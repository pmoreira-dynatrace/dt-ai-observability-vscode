receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:${env:COLLECTOR_PORT}
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  cumulative_to_delta: {}
  resource:
    attributes:
      - { key: user.email,             value: "${env:USER_EMAIL}", action: upsert }
      - { key: deployment.environment, value: demo,                action: upsert }
      - { key: ide.name,    value: "${env:IDE_NAME}",    action: upsert }
      - { key: ide.version, value: "${env:IDE_VERSION}",  action: upsert }
      - { key: os.type,     value: "${env:OS_TYPE}",      action: upsert }
  # Copilot internal agent spans contain <environment_info>/<workspace_info> injected by VS Code.
  # We hide the prompt/completion content to avoid noise, but keep token attributes intact.
  # Note: this condition matches only Copilot Chat spans (gen_ai.prompt as a JSON string).
  # Claude Code spans use flattened attributes (gen_ai.prompt.0.content) and are unaffected.
  # Removing tokens from spans would cause chart/table discrepancy: the AI Obs chart reads from
  # the gen_ai.client.token.usage metric (unaffected by span transforms), while the table reads
  # span attributes — deleting span tokens makes table undercount vs the chart.
  transform/copilot_internal:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["gen_ai.prompt"] != nil and IsMatch(attributes["gen_ai.prompt"], ".*<environment_info>.*")
        statements:
          - set(attributes["gen_ai.prompt"], "[internal agent context — content hidden]")
          - set(attributes["gen_ai.completion"], "[internal agent context — content hidden]")
          - set(attributes["copilot.internal"], true)

exporters:
  debug:
    verbosity: normal
  otlp_http/dynatrace:
    endpoint: "${env:DT_OTLP_ENDPOINT}"
    headers:
      Authorization: "Api-Token ${env:DT_INGEST_TOKEN}"
    compression: gzip

extensions:
  health_check:
    endpoint: 0.0.0.0:${env:HEALTH_PORT}

service:
  telemetry:
    metrics:
      level: none   # evita conflito na porta 8888 (métricas internas do coletor)
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [transform/copilot_internal, batch, resource]
      exporters:  [debug, otlp_http/dynatrace]
    metrics:
      receivers:  [otlp]
      processors: [cumulative_to_delta, batch, resource]
      exporters:  [otlp_http/dynatrace]
