receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:${env:COLLECTOR_PORT}
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  cumulativetodelta: {}
  resource:
    attributes:
      - { key: user.email,             value: "${env:USER_EMAIL}", action: upsert }
      - { key: deployment.environment, value: demo,                action: upsert }
  # Copilot internal agent spans contain <environment_info>/<workspace_info> injected by VS Code.
  # Instead of dropping them (which would lose their token counts), we clear the prompt/completion
  # content so they don't pollute the Prompts stream, while keeping tokens for accurate accounting.
  transform/copilot_internal:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["gen_ai.prompt"] != nil and IsMatch(attributes["gen_ai.prompt"], ".*<environment_info>.*")
        statements:
          - set(attributes["gen_ai.prompt"], "[internal agent context — content hidden]")
          - set(attributes["gen_ai.completion"], "[internal agent context — content hidden]")
          - set(attributes["copilot.internal"], true)
          - delete_key(attributes, "gen_ai.usage.input_tokens")
          - delete_key(attributes, "gen_ai.usage.output_tokens")

exporters:
  debug:
    verbosity: normal
  otlphttp/dynatrace:
    endpoint: "${env:DT_OTLP_ENDPOINT}"
    headers:
      Authorization: "Api-Token ${env:DT_INGEST_TOKEN}"
    compression: gzip

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  telemetry:
    metrics:
      level: none   # evita conflito na porta 8888 (métricas internas do coletor)
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [transform/copilot_internal, batch, resource]
      exporters:  [debug, otlphttp/dynatrace]
    metrics:
      receivers:  [otlp]
      processors: [cumulativetodelta, batch, resource]
      exporters:  [otlphttp/dynatrace]
